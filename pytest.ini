[pytest]
# Pytest configuration for Jira Agentic Development System

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    # Coverage options disabled - install pytest-cov to enable
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-report=xml

# Coverage options
[coverage:run]
source = agents,backend,workflows
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
