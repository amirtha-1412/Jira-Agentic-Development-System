# GitHub Actions CI/CD - Jira Agentic Development System
name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Linting
  # ─────────────────────────────────────────────
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint
          pip install -r requirements.txt
      
      - name: Run Black (code formatter check)
        run: |
          black --check --diff agents/ backend/ workflows/
        continue-on-error: true
      
      - name: Run isort (import sorting check)
        run: |
          isort --check-only --diff agents/ backend/ workflows/
        continue-on-error: true
      
      - name: Run Flake8 (style guide enforcement)
        run: |
          flake8 agents/ backend/ workflows/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 agents/ backend/ workflows/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run Pylint (code analysis)
        run: |
          pylint agents/ backend/ workflows/ --exit-zero --max-line-length=127
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Backend Tests
  # ─────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt
      
      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/ -v --cov=agents --cov=backend --cov=workflows --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  # ─────────────────────────────────────────────
  # Job 3: Frontend Tests
  # ─────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests
        working-directory: frontend
        run: npm test -- --run
        continue-on-error: true
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 4: Security Scan
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 5: Docker Build Test
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: jira-agentic-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: jira-agentic-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 6: Update PR Status
  # ─────────────────────────────────────────────
  update-status:
    name: Update Workflow Status
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, security, docker-build]
    if: always()
    
    steps:
      - name: Check job statuses
        id: check
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test-backend.result }}" == "success" ] && \
             [ "${{ needs.test-frontend.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All checks passed ✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some checks failed ❌" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}';
            const message = '${{ steps.check.outputs.message }}';
            
            const body = `## 🤖 CI/CD Pipeline Results
            
            ${message}
            
            ### Job Results:
            - **Linting**: ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Backend Tests**: ${{ needs.test-backend.result == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Frontend Tests**: ${{ needs.test-frontend.result == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Security Scan**: ${{ needs.security.result == 'success' && '✅ Passed' || '⚠️ Check logs' }}
            - **Docker Build**: ${{ needs.docker-build.result == 'success' && '✅ Passed' || '❌ Failed' }}
            
            ### Next Steps:
            ${status === 'success' ? '✅ Ready for review and merge!' : '❌ Please fix failing checks before merging.'}
            
            ---
            *Automated by Jira Agentic Development System*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Set commit status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}';
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: status,
              context: 'CI/CD Pipeline',
              description: status === 'success' ? 'All checks passed' : 'Some checks failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
