# Auto-labeler configuration
# Labels PRs based on changed files

'backend':
  - backend/**/*
  - agents/**/*
  - workflows/**/*

'frontend':
  - frontend/**/*

'tests':
  - tests/**/*
  - '**/*test*.py'
  - '**/*test*.js'
  - '**/*test*.jsx'

'documentation':
  - '**/*.md'
  - docs/**/*

'docker':
  - Dockerfile*
  - docker-compose*.yml
  - .dockerignore

'ci/cd':
  - .github/**/*

'dependencies':
  - requirements.txt
  - package.json
  - package-lock.json

'configuration':
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.json'
  - '**/*.toml'
  - .env*
